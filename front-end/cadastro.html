 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade Segura - Cadastro</title>
    <link rel="stylesheet" href= "css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <span class="material-symbols-outlined logo-icon">shield</span>
                <h1>Cidade Segura</h1>
                <p class="subtitle">Criar nova conta de acesso</p>
            </div>

            <form action="/cadastro" method="POST">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <div class="input-field">
                        <span class="material-symbols-outlined input-icon">person</span>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-field">
                        <span class="material-symbols-outlined input-icon">mail</span>
                        <input type="email" id="email" name="e-mail" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="numero">Telefone</label>
                    <div class="input-field">
                        <span class="material-symbols-outlined input-icon">call</span>
                        <input type="number" id="numero" name="numero" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Senha de Acesso</label>
                    <div class="input-field">
                        <span class="material-symbols-outlined input-icon">lock</span>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span class="material-symbols-outlined">vpn_key</span>
                    Cadastrar Sistema
                </button>
            </form>
            
            <div class="card-footer">
                <span class="status-indicator"></span> Conexão Segura SSL Ativa
            </div>
        </div>
    </div>

</body>
</html>
